name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system dependencies
        # the runner's mirrors sometimes fail to resolve for minutes: retry the index and the fetches
        run: |
          for i in 1 2 3 4; do sudo apt-get update -o Acquire::Retries=3 && break; sleep 20; done
          sudo apt-get install -y -o Acquire::Retries=3 libegl1-mesa libgles2-mesa

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: |
          node test/test-triangle.mjs
          node test/test-all.mjs
          node test/test-drawing-buffer.mjs
          node test/test-compressed-textures.mjs
          node test/test-compressed-threejs.mjs
        env:
          EGL_PLATFORM: surfaceless
